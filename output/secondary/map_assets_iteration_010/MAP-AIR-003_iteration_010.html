      if (!vb || !vb.width || !vb.height || !box.width || !box.height) return;
      const sx = box.width / vb.width;
      const sy = box.height / vb.height;
      const w = 24 / sx;
      const h = 24 / sy;
      const stroke = 0.55 / Math.sqrt(sx * sy);
      svg.querySelectorAll('pattern[data-boundary-pattern="i004"]').forEach(pattern => {
        pattern.setAttribute('width', w.toFixed(4));
        pattern.setAttribute('height', h.toFixed(4));
        const path = pattern.querySelector('path');
        path.setAttribute(
          'd',
          `M${(-w/6).toFixed(4)},${(h/6).toFixed(4)} ` +
          `L${(w/6).toFixed(4)},${(-h/6).toFixed(4)} ` +
          `M0,${h.toFixed(4)} L${w.toFixed(4)},0 ` +
          `M${(5*w/6).toFixed(4)},${(7*h/6).toFixed(4)} ` +
          `L${(7*w/6).toFixed(4)},${(5*h/6).toFixed(4)}`
        );
        path.setAttribute('stroke-width', stroke.toFixed(5));
      });
    });
  };
  requestAnimationFrame(() => requestAnimationFrame(update));
  window.addEventListener('resize', update, {passive:true});
})();
</script>
</body></html>
