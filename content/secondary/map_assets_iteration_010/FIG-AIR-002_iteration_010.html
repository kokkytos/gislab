<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8"/><style>
    :root {
      --ink: #172231;
      --muted: #586779;
      --paper: #f4f1ea;
      --card: #fffdf8;
      --line: #d8d2c7;
      --historical: #d29b52;
      --historical-dark: #8f5f26;
      --canonical: #176b87;
      --canonical-dark: #0c4962;
      --accent: #b4432f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, "Avenir Next", "Segoe UI", Arial, sans-serif;
      line-height: 1.55;
    }
    main { width: min(1180px, calc(100% - 40px)); margin: 42px auto 70px; }
    header {
      padding: 42px;
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(130deg, #103e57, #176b87 62%, #5c8e91);
      box-shadow: 0 16px 40px rgba(20, 44, 55, .16);
    }
    .eyebrow {
      margin: 0 0 8px;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .82;
    }
    h1 { max-width: 850px; margin: 0; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.08; }
    .subtitle { max-width: 850px; margin: 18px 0 0; font-size: 1.08rem; opacity: .9; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 22px 0;
    }
    .metric, section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 9px 25px rgba(46, 45, 38, .07);
    }
    .metric { padding: 22px; }
    .metric strong { display: block; color: var(--canonical-dark); font-size: 1.8rem; }
    .metric span { color: var(--muted); font-size: .92rem; }
    section { margin-top: 22px; padding: 28px; }
    h2 { margin: 0 0 14px; font-size: 1.45rem; }
    p { margin: 10px 0; }
    .chart-wrap { overflow-x: auto; }
    .chart { display: block; width: 100%; min-width: 760px; height: auto; }
    .grid { stroke: #ded9cf; stroke-width: 1; }
    .axis { stroke: #6b7782; stroke-width: 1.5; }
    .year-tick { stroke: #6b7782; stroke-width: 1.2; }
    .axis-label, .x-label { fill: var(--muted); font-size: 14px; }
    .axis-title { fill: var(--ink); font-size: 15px; font-weight: 700; }
    .missing-band { fill: #ebe7df; opacity: .72; }
    .missing-label {
      fill: #6f7478;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .02em;
    }
    .series-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .historical-line { stroke: var(--historical-dark); stroke-width: 4; }
    .missing-line {
      stroke: #7d858b;
      stroke-width: 4;
      stroke-dasharray: 11 9;
    }
    .canonical-line { stroke: var(--canonical); stroke-width: 4; }
    .data-point { stroke-width: 3; }
    .data-point.historical, .data-point.lower_bound {
      fill: var(--card);
      stroke: var(--historical-dark);
    }
    .data-point.canonical { fill: var(--canonical); stroke: var(--card); }
    .value-label { font-size: 15px; font-weight: 800; }
    .value-label.historical, .value-label.lower_bound { fill: var(--historical-dark); }
    .value-label.canonical { fill: var(--canonical-dark); }
    .lower-arrow { fill: none; stroke: var(--historical-dark); stroke-width: 2; }
    .legend { fill: var(--muted); font-size: 13px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 13px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #eef1ef; color: #334554; font-size: .85rem; letter-spacing: .02em; }
    td.number { white-space: nowrap; font-weight: 800; }
    code { white-space: normal; color: #3f5360; font-size: .82rem; }
    .note {
      border-left: 5px solid var(--accent);
      background: #fff5ef;
      padding: 17px 20px;
      margin-top: 20px;
    }
    .source-list { color: var(--muted); }
    footer { margin-top: 24px; color: var(--muted); font-size: .85rem; }
    @media (max-width: 760px) {
      main { width: min(100% - 24px, 1180px); margin-top: 16px; }
      header { padding: 28px 24px; }
      .metrics { grid-template-columns: 1fr; }
      section { padding: 22px 18px; }
    }
  </style>
